name: Deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: "7 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Ecopower prices
        run: "./ecopower_dynamisch.sh > ecopower.json"
      - name: Generate price forecast
        run: "./epex_forecast.sh > forecast.json"
      - run: "cp ecopower.json index.html"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
